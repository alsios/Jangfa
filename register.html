<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hennessy - Registre</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #4cd964;
            color: #333;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* En-tête vert */
        .top-header {
            background-color: #4cd964;
            color: #fff;
            padding: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .back-btn {
            position: absolute;
            left: 15px;
            color: #fff;
            text-decoration: none;
            font-size: 18px;
        }

        .brand-title {
            font-size: 18px;
            font-weight: 500;
        }

        /* Conteneur blanc avec arrondi supérieur gauche */
        .main-container {
            background-color: #fff;
            flex: 1;
            border-top-left-radius: 40px;
            padding: 25px 20px;
            margin-top: 10px;
            box-shadow: 0 -4px 15px rgba(0,0,0,0.05);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            font-size: 14px;
            color: #333;
            font-weight: 400;
            margin-bottom: 8px;
            display: block;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            border-bottom: 1px solid #e0e0e0;
            padding-bottom: 8px;
        }

        .input-icon {
            color: #4cd964;
            font-size: 16px;
            margin-right: 10px;
        }

        .form-input {
            width: 100%;
            border: none;
            outline: none;
            font-size: 14px;
            color: #333;
            background: transparent;
        }

        .form-input::placeholder {
            color: #aaa;
        }

        .prefix-phone {
            color: #aaa;
            font-size: 14px;
            margin-right: 5px;
        }

        /* Captcha spécifique */
        .captcha-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .captcha-input-wrap {
            flex: 1;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            align-items: center;
            padding-bottom: 8px;
            margin-right: 15px;
        }

        .captcha-box {
            background: #f0f0f0;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 6px 12px;
            font-size: 20px;
            font-weight: 900;
            font-style: italic;
            letter-spacing: 3px;
            color: #333;
            user-select: none;
            cursor: pointer;
            min-width: 100px;
            text-align: center;
        }

        /* Bouton d'inscription vert ovale */
        .btn-submit {
            width: 100%;
            background: #4cd964;
            color: #fff;
            border: none;
            padding: 14px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            text-align: center;
            margin-top: 30px;
            box-shadow: 0 4px 10px rgba(76, 217, 100, 0.3);
        }

        .btn-submit:active {
            opacity: 0.8;
        }

        .auth-footer {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: #666;
        }

        .auth-footer a {
            color: #4cd964;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="top-header">
        <a href="index.html" class="back-btn"><i class="fas fa-chevron-left"></i></a>
        <div class="brand-title">S'inscrire</div>
    </div>

    <div class="main-container">
        
        <div class="form-group">
            <label class="form-label">Mobile</label>
            <div class="input-wrapper">
                <i class="fas fa-mobile-alt input-icon"></i>
                <span class="prefix-phone">+243</span>
                <input type="tel" id="phone" class="form-input" placeholder="Veuillez entrer un compte mobile" maxlength="10">
            </div>
        </div>

        <div class="form-group">
            <label class="form-label">Mot De Passe</label>
            <div class="input-wrapper">
                <i class="fas fa-lock input-icon"></i>
                <input type="password" id="password" class="form-input" placeholder="S'il vous plaît mot de passe d'entrée">
            </div>
        </div>

        <div class="form-group">
            <label class="form-label">Confirmer Le Mot De Passe</label>
            <div class="input-wrapper">
                <i class="fas fa-lock input-icon"></i>
                <input type="password" id="confirmPassword" class="form-input" placeholder="Veuillez entrer à nouveau le mot de passe">
            </div>
        </div>

        <div class="form-group">
            <label class="form-label">Code D'invitation</label>
            <div class="input-wrapper">
                <i class="fas fa-check-circle input-icon" style="color: #4cd964;"></i>
                <input type="text" id="inviteCode" class="form-input" value="P26kSI">
            </div>
        </div>

        <div class="form-group">
            <label class="form-label">Code De Vérification</label>
            <div class="captcha-row">
                <div class="captcha-input-wrap">
                    <i class="fas fa-mobile-alt input-icon"></i>
                    <input type="text" id="captchaInput" class="form-input" placeholder="Code de vérification" maxlength="4">
                </div>
                <div class="captcha-box" id="captchaDisplay" onclick="generateCaptcha()" title="Cliquer pour changer">6453</div>
            </div>
        </div>

        <button type="button" class="btn-submit" onclick="registerUser()">
            Inscrivez-vous
        </button>

        <div class="auth-footer">
            Vous avez déjà un compte ? <a href="index.html">Se connecter</a>
        </div>

    </div>

    <script>
        const dbUrl = "https://sonyy-9b565-default-rtdb.firebaseio.com";
        let generatedCaptcha = "6453";

        function generateCaptcha() {
            generatedCaptcha = Math.floor(1000 + Math.random() * 9000).toString();
            document.getElementById('captchaDisplay').innerText = generatedCaptcha;
        }

        window.addEventListener('DOMContentLoaded', () => {
            generateCaptcha();
            const urlParams = new URLSearchParams(window.location.search);
            const refParam = urlParams.get('ref');
            if (refParam) {
                document.getElementById('inviteCode').value = refParam.trim();
            }
        });

        function generateUserInviteCode() {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            let code = '';
            for (let i = 0; i < 6; i++) {
                code += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return code;
        }

        async function registerUser() {
            const phone = document.getElementById('phone').value.trim();
            const password = document.getElementById('password').value.trim();
            const confirmPassword = document.getElementById('confirmPassword').value.trim();
            const inviteCodeInput = document.getElementById('inviteCode').value.trim();
            const captchaInput = document.getElementById('captchaInput').value.trim();

            if (!phone || phone.length < 9) {
                alert("Veuillez entrer un numéro de téléphone valide.");
                return;
            }

            if (!password || password.length < 4) {
                alert("Le mot de passe doit contenir au moins 4 caractères.");
                return;
            }

            if (password !== confirmPassword) {
                alert("Les mots de passe ne correspondent pas.");
                return;
            }

            if (captchaInput !== generatedCaptcha) {
                alert("Code de vérification incorrect.");
                generateCaptcha();
                document.getElementById('captchaInput').value = "";
                return;
            }

            try {
                const checkRes = await fetch(`${dbUrl}/users/${encodeURIComponent(phone)}.json`);
                const existingUser = await checkRes.json();

                if (existingUser) {
                    alert("Ce numéro de téléphone est déjà enregistré.");
                    return;
                }

                const myInviteCode = generateUserInviteCode();
                const newUser = {
                    phone: phone,
                    password: password,
                    referredBy: inviteCodeInput || "",
                    inviteCode: myInviteCode,
                    balance: 0,
                    createdAt: new Date().toISOString()
                };

                const saveRes = await fetch(`${dbUrl}/users/${encodeURIComponent(phone)}.json`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(newUser)
                });

                if (saveRes.ok) {
                    localStorage.setItem('userPhone', phone);
                    alert("Inscription réussie !");
                    window.location.href = "dashboard.html";
                } else {
                    alert("Erreur lors de l'enregistrement. Veuillez réessayer.");
                }

            } catch (err) {
                console.error("Erreur technique :", err);
                alert("Impossible de contacter le serveur de base de données.");
            }
        }
    </script>
</body>
</html>
