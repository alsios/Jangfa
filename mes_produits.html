<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JANGFA | Mes Serveurs</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { background-color: #f8fafc; font-family: 'Poppins', sans-serif; padding-bottom: 120px; color: #0f172a; }
        .my-card { background: white; border-radius: 1.5rem; overflow: hidden; margin-bottom: 20px; border: 1px solid #e2e8f0; box-shadow: 0 4px 15px rgba(15, 23, 42, 0.03); transition: border-color 0.2s; }
        .my-card:hover { border-color: #bbf7d0; }
        .my-img { width: 100%; height: 180px; object-fit: cover; }
        .btn-collect { background: #16a34a; color: white; width: 100%; padding: 14px; border-radius: 1rem; font-weight: 800; font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px; box-shadow: 0 4px 12px rgba(22, 163, 74, 0.25); transition: background 0.2s, transform 0.1s; }
        .btn-collect:hover { background: #15803d; }
        .btn-collect:active { transform: scale(0.98); }
        .btn-disabled { background: #f1f5f9; color: #94a3b8; width: 100%; padding: 14px; border-radius: 1rem; font-weight: 800; font-size: 13px; text-transform: uppercase; cursor: not-allowed; border: 1px solid #e2e8f0; }
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: white; display: flex; justify-content: space-around; padding: 12px 0; border-top: 1px solid #e2e8f0; z-index: 1000; box-shadow: 0 -4px 20px rgba(15, 23, 42, 0.04); }
        .nav-link { text-align: center; color: #94a3b8; font-size: 11px; text-decoration: none; font-weight: bold; transition: color 0.2s; }
        .nav-link.active { color: #16a34a; }
    </style>
</head>
<body class="p-5">

    <div class="mb-6 pt-2 flex items-center gap-3.5">
        <button onclick="window.location.href='produit.html'" class="w-10 h-10 rounded-xl bg-white border border-slate-200 flex items-center justify-center text-slate-800 text-base shadow-sm active:scale-95 transition-all"><i class="fa-solid fa-arrow-left"></i></button>
        <div>
            <h1 class="text-xl font-black tracking-tight text-slate-900 uppercase">MES INVESTISSEMENTS</h1>
            <p class="text-slate-400 text-[10px] font-bold uppercase tracking-widest">Récolte disponible toutes les 24 heures</p>
        </div>
    </div>

    <!-- Zone d'affichage des serveurs loués -->
    <div id="my-products-container" class="space-y-4">
        <p id="loading-msg" class="text-center text-slate-400 font-medium py-10">Chargement de vos serveurs...</p>
    </div>

    <!-- Barre de navigation inférieure -->
    <nav class="bottom-nav">
        <a href="dashboard.html" class="nav-link">
            <i class="fa-solid fa-house text-xl mb-1"></i><br><span class="text-[10px] font-bold">Accueil</span>
        </a>
        <a href="produit.html" class="nav-link active">
            <i class="fa-solid fa-server text-xl mb-1"></i><br><span class="text-[10px] font-bold">Produits</span>
        </a>
        <a href="equipe.html" class="nav-link">
            <i class="fa-solid fa-users text-xl mb-1"></i><br><span class="text-[10px] font-bold">Équipe</span>
        </a>
        <a href="compte.html" class="nav-link">
            <i class="fa-solid fa-user text-xl mb-1"></i><br><span class="text-[10px] font-bold">Compte</span>
        </a>
    </nav>

    <script>
        const session = JSON.parse(localStorage.getItem('sonny_session'));
        const dbURL = "https://sonyy-9b565-default-rtdb.firebaseio.com";

        if(!session) { window.location.href = "index.html"; }

        async function loadMyProducts() {
            const container = document.getElementById('my-products-container');
            try {
                const iRes = await fetch(`${dbURL}/investissements/${session.firebaseId}.json`);
                const products = await iRes.json();

                if (!products || Object.keys(products).length === 0) {
                    container.innerHTML = `
                        <div class="text-center py-16 bg-white rounded-[2rem] p-6 border border-dashed border-slate-200 shadow-sm">
                            <i class="fa-solid fa-server text-4xl text-slate-300 mb-3"></i>
                            <p class="text-slate-500 text-xs font-semibold">Vous n'avez pas encore loué de serveur.</p>
                            <button onclick="window.location.href='produit.html'" class="mt-4 bg-green-600 hover:bg-green-700 text-white font-bold px-6 py-2.5 rounded-xl text-[10px] uppercase tracking-wider shadow-md shadow-green-600/25 transition-all">Visiter la boutique</button>
                        </div>
                    `;
                    return;
                }

                container.innerHTML = "";
                const now = new Date();

                for (let key in products) {
                    const prod = products[key];
                    const lastCollect = new Date(prod.dernierCollecte);
                    const expiry = new Date(prod.expireLe);
                    
                    // Calcul du temps écoulé
                    const diffHours = (now - lastCollect) / (1000 * 60 * 60);
                    const isExpired = now >= expiry;

                    let actionButton = "";

                    if (isExpired) {
                        actionButton = `<button class="btn-disabled" disabled>Pack Expiré</button>`;
                    } else if (diffHours >= 24) {
                        actionButton = `<button onclick="collecterGain('${key}', ${prod.gainJournalier})" class="btn-collect">Récolter ${prod.gainJournalier.toLocaleString()} CDF</button>`;
                    } else {
                        // Calcul du temps restant pour la prochaine récolte
                        const remainingHours = Math.ceil(24 - diffHours);
                        actionButton = `<button class="btn-disabled" disabled><i class="fa-solid fa-clock mr-1.5"></i> Prochaine récolte dans ${remainingHours}h</button>`;
                    }

                    container.innerHTML += `
                        <div class="my-card">
                            <img src="${prod.img || 'IMG_7280.jpeg'}" class="my-img">
                            <div class="p-5">
                                <div class="flex justify-between items-center mb-3">
                                    <h2 class="font-black text-base uppercase text-slate-800 tracking-tight">${prod.nom}</h2>
                                    <span class="text-[9px] bg-green-50 text-green-600 border border-green-100 px-3 py-1 rounded-full font-black uppercase tracking-wider">Actif</span>
                                </div>
                                <div class="text-xs text-slate-500 space-y-2 mb-4 bg-slate-50 p-3.5 rounded-2xl border border-slate-100">
                                    <div class="flex justify-between"><span>Production 24h :</span> <strong class="text-slate-800 font-bold">${prod.gainJournalier.toLocaleString()} CDF</strong></div>
                                    <div class="flex justify-between"><span>Dernière collecte :</span> <strong class="text-slate-800 font-bold">${lastCollect.toLocaleDateString()}</strong></div>
                                </div>
                                ${actionButton}
                            </div>
                        </div>
                    `;
                }
            } catch (e) {
                container.innerHTML = `<p class="text-center text-rose-500 text-xs font-semibold py-10">Erreur de chargement. Vérifiez votre connexion.</p>`;
            }
        }

        // Système de récolte manuelle et crédit automatique sur Firebase
        async function collecterGain(prodKey, gain) {
            try {
                // 1. Charger le profil utilisateur actuel
                const uRes = await fetch(`${dbURL}/utilisateurs/${session.firebaseId}.json`);
                const user = await uRes.json();

                const nouveauSolde = (user.solde || 0) + gain;
                const nouveauRevenu = (user.revenuCumule || 0) + gain;

                // 2. Mettre à jour le solde et le revenu cumulé dans Firebase
                await fetch(`${dbURL}/utilisateurs/${session.firebaseId}.json`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        solde: nouveauSolde, 
                        revenuCumule: nouveauRevenu 
                    })
                });

                // 3. Mettre à jour la date de dernière récolte pour ce produit précis
                await fetch(`${dbURL}/investissements/${session.firebaseId}/${prodKey}.json`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ dernierCollecte: new Date().toISOString() })
                });

                alert(`✅ Récolte réussie ! +${gain.toLocaleString()} CDF ajoutés à votre solde.`);
                loadMyProducts(); // Recharger l'affichage
            } catch(e) {
                alert("❌ Erreur lors de la récolte.");
            }
        }

        window.onload = loadMyProducts;
    </script>
</body>
</html>
